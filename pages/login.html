<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Papelaria Futura</title>
<link rel="icon" href="/assets/icons/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/responsive.css">
<style>
  .auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
  .auth-card {
    width: min(400px, 100%); background: var(--branco); border-radius: var(--raio-lg);
    box-shadow: var(--sombra-lg); padding: 2rem; display: grid; gap: 1rem;
  }
  .auth-card label { display: grid; gap: 0.3rem; font-size: 0.85rem; color: var(--cinza-700); }
  .auth-card input { padding: 0.65rem 0.9rem; border: 1px solid var(--cinza-300); border-radius: var(--raio-sm); font-size: 0.95rem; }
  .auth-tabs { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
  .auth-tabs button { flex: 1; padding: 0.6rem; border-radius: var(--raio-sm); background: var(--cinza-050); font-weight: 600; }
  .auth-tabs button.is-active { background: var(--azul-100); color: var(--azul-700); }
  .auth-error { color: #b42318; font-size: 0.85rem; min-height: 1.2em; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="/" class="logo" style="justify-content:center"><img src="/assets/images/logo.svg" alt="Papelaria Futura">Papelaria Futura</a>

    <div class="auth-tabs">
      <button data-auth-tab="entrar" class="is-active">Entrar</button>
      <button data-auth-tab="cadastrar">Criar conta</button>
    </div>

    <form id="form-entrar">
      <label>E-mail<input type="email" name="email" required autocomplete="username"></label>
      <label>Senha<input type="password" name="senha" required autocomplete="current-password"></label>
      <p class="auth-error" id="erro-entrar"></p>
      <button type="submit" class="btn-primary" style="width:100%">Entrar</button>
    </form>

    <form id="form-cadastrar" hidden>
      <label>Nome<input type="text" name="nome" required autocomplete="name"></label>
      <label>E-mail<input type="email" name="email" required autocomplete="username"></label>
      <label>Senha<input type="password" name="senha" required minlength="6" autocomplete="new-password"></label>
      <p class="auth-error" id="erro-cadastrar"></p>
      <button type="submit" class="btn-primary" style="width:100%">Criar conta</button>
    </form>
  </div>
</div>

<script type="module">
import { entrar, cadastrar } from "../js/auth.js";
import { podeExecutar } from "../js/utils.js";

document.querySelectorAll("[data-auth-tab]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-auth-tab]").forEach(b => b.classList.remove("is-active"));
    btn.classList.add("is-active");
    document.querySelector("#form-entrar").hidden = btn.dataset.authTab !== "entrar";
    document.querySelector("#form-cadastrar").hidden = btn.dataset.authTab !== "cadastrar";
  });
});

document.querySelector("#form-entrar").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  if (!podeExecutar("login", 5, 60_000)) {
    document.querySelector("#erro-entrar").textContent = "Muitas tentativas. Aguarde um minuto e tente novamente.";
    return;
  }
  try {
    await entrar(form.email.value, form.senha.value);
    window.location.href = "/";
  } catch (err) {
    document.querySelector("#erro-entrar").textContent = "Não foi possível entrar. Verifique seus dados.";
  }
});

document.querySelector("#form-cadastrar").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  if (!podeExecutar("cadastrar", 3, 60_000)) {
    document.querySelector("#erro-cadastrar").textContent = "Muitas tentativas. Aguarde um minuto e tente novamente.";
    return;
  }
  try {
    await cadastrar(form.nome.value, form.email.value, form.senha.value);
    window.location.href = "/";
  } catch (err) {
    document.querySelector("#erro-cadastrar").textContent = "Não foi possível criar a conta.";
  }
});
</script>
</body>
</html>
