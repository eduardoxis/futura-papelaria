<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="titulo-pagina">Produto — Papelaria Futura</title>
<meta id="meta-desc" name="description" content="">
<meta id="og-title" property="og:title" content="">
<meta id="og-desc" property="og:description" content="">
<meta id="og-image" property="og:image" content="">
<link rel="icon" href="/assets/icons/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/modal.css">
<link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

<header class="site-header">
  <div class="container header-top">
    <a href="/" class="logo">
      <img src="/assets/images/logo.png" alt="Papelaria Futura" class="logo__mark">
      <span class="logo__text">Papelaria<br>Futura</span>
    </a>
    <a href="/" class="btn-secondary" style="margin-left:auto">
      <span data-icon="chevronLeft"></span><span>Voltar ao catálogo</span>
    </a>
  </div>
</header>

<main class="container" id="conteudo-produto">
  <nav class="breadcrumb" id="breadcrumb" aria-label="Trilha de navegação"></nav>

  <div class="product-detail" id="detalhe-produto">
    <p>Carregando produto...</p>
  </div>

  <section class="related-products" id="produtos-relacionados" hidden>
    <div class="related-products__head">
      <h2>Produtos relacionados</h2>
      <div class="related-products__nav">
        <button type="button" class="related-products__arrow" id="relacionados-prev" aria-label="Ver anteriores"><span data-icon="chevronLeft"></span></button>
        <button type="button" class="related-products__arrow" id="relacionados-next" aria-label="Ver próximos"><span data-icon="chevronRight"></span></button>
      </div>
    </div>
    <div class="related-products__track" id="relacionados-track"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-grid">
    <div>
      <h4>Livraria Papelaria Futura</h4>
      <p>R. Dr. Ézio Carneiro, 158 - St. Aeroporto, Luziânia - GO, 72800-420</p>
    </div>
    <div>
      <h4>Contato</h4>
      <a href="https://wa.me/5561999184452" target="_blank" rel="noopener">WhatsApp</a>
      <p>futuralza@gmail.com</p>
    </div>
    <div>
      <h4>Redes sociais</h4>
      <div class="social-row">
        <a href="https://www.instagram.com/futurapapelaria/" aria-label="Instagram" target="_blank" rel="noopener"><span data-icon="instagram"></span></a>
      </div>
    </div>
  </div>
  <div class="footer-bottom">© 2026 Papelaria Futura. Todos os direitos reservados.</div>
</footer>

<script type="module">
import { obterProduto, incrementarVisualizacao, listarProdutos } from "../js/firestore.js";
import { formatBRL, escHtml, getQueryParam, toast } from "../js/utils.js";
import { adicionarAoCarrinho, atualizarBadgeCarrinho, falarSobreProduto } from "../js/cart.js";
import { compartilharProduto, cartaoProduto, renderizarGrade } from "../js/products.js";
import { ICONS } from "../js/icons.js";

function aplicarIconesEstaticos() {
  document.querySelectorAll("[data-icon]").forEach(el => {
    const nome = el.dataset.icon;
    if (ICONS[nome] && !el.querySelector("svg")) {
      el.innerHTML = ICONS[nome];
      el.classList.add("icon");
    }
  });
}
aplicarIconesEstaticos();

const id = getQueryParam("id");
const container = document.querySelector("#detalhe-produto");

async function iniciar() {
  if (!id) { container.innerHTML = "<p>Produto não encontrado.</p>"; return; }
  const produto = await obterProduto(id);
  if (!produto) { container.innerHTML = "<p>Produto não encontrado.</p>"; return; }

  document.title = `${produto.nome} — Papelaria Futura`;
  document.querySelector("#meta-desc").content = produto.descricao || produto.nome;
  document.querySelector("#og-title").content = produto.nome;
  document.querySelector("#og-desc").content = produto.descricao || "";
  document.querySelector("#og-image").content = produto.imagem || "";

  const semEstoque = produto.status === "sem_estoque" || Number(produto.quantidade) <= 0;
  const imagens = (Array.isArray(produto.imagens) && produto.imagens.length ? produto.imagens : [produto.imagem]).filter(Boolean);
  if (!imagens.length) imagens.push("/assets/images/placeholder.svg");

  const especificacoes = [
    { icon: "tag", label: "Categoria", valor: produto.categoria },
    { icon: "bookmark", label: "Marca", valor: produto.marca },
    { icon: "copy", label: "Código", valor: produto.codigo },
    { icon: "box", label: "Disponibilidade", valor: semEstoque ? "Sem estoque" : `${produto.quantidade} disponíveis` },
    ...(Array.isArray(produto.especificacoes) ? produto.especificacoes.map(e => ({ icon: "clipboardList", label: e.label, valor: e.valor })) : [])
  ].filter(e => e.valor);

  document.querySelector("#breadcrumb").innerHTML = `
    <a href="/">Início</a>
    <span data-icon="chevronRight"></span>
    <a href="/#produtos">Catálogo</a>
    ${produto.categoria ? `
      <span data-icon="chevronRight"></span>
      <a href="/?categoria=${encodeURIComponent(produto.categoria)}#produtos">${escHtml(produto.categoria)}</a>
    ` : ""}
    <span data-icon="chevronRight"></span>
    <span class="breadcrumb__atual">${escHtml(produto.nome)}</span>`;

  container.innerHTML = `
    <div class="product-detail__gallery">
      ${imagens.length > 1 ? `
        <div class="product-detail__thumbs">
          ${imagens.map((img, i) => `
            <button type="button" class="product-detail__thumb ${i === 0 ? "is-active" : ""}" data-thumb="${i}">
              <img src="${img}" alt="${escHtml(produto.nome)} - imagem ${i + 1}" loading="lazy">
            </button>`).join("")}
        </div>` : ""}
      <div class="product-detail__image">
        <img id="imagem-principal" src="${imagens[0]}" alt="${escHtml(produto.nome)}" loading="lazy">
      </div>
    </div>
    <div class="product-detail__info">
      ${produto.marca ? `<span class="product-detail__brand">${escHtml(produto.marca)}</span>` : ""}
      <h1 class="product-detail__name">${escHtml(produto.nome)}</h1>
      <span class="product-detail__price">${formatBRL(produto.preco)}</span>
      <p class="product-detail__desc">${escHtml(produto.descricao || "")}</p>
      <div class="qty-stepper">
        <button id="dim" aria-label="Diminuir quantidade">−</button>
        <input id="qtd" type="number" value="1" min="1">
        <button id="aum" aria-label="Aumentar quantidade">+</button>
      </div>
      <div class="product-detail__actions">
        <button class="btn-primary" id="add-carrinho" ${semEstoque ? "disabled" : ""}><span data-icon="cart"></span>Adicionar ao carrinho</button>
        <button class="btn-whatsapp-lg" id="falar-produto"><span data-icon="whatsapp"></span>Falar sobre este produto</button>
        <button class="btn-secondary" id="compartilhar"><span data-icon="messageSquare"></span>Compartilhar</button>
        <button class="btn-secondary" id="copiar-link"><span data-icon="copy"></span>Copiar link</button>
      </div>
      ${especificacoes.length ? `
      <ul class="product-detail__specs">
        ${especificacoes.map(e => `
          <li>
            <span class="product-detail__specs-icon" data-icon="${e.icon}"></span>
            <strong>${escHtml(e.label)}</strong>
            <span>${escHtml(String(e.valor))}</span>
          </li>`).join("")}
      </ul>` : ""}
    </div>`;

  aplicarIconesEstaticos();

  container.querySelectorAll("[data-thumb]").forEach(btn => {
    btn.addEventListener("click", () => {
      container.querySelectorAll("[data-thumb]").forEach(b => b.classList.remove("is-active"));
      btn.classList.add("is-active");
      document.querySelector("#imagem-principal").src = imagens[Number(btn.dataset.thumb)];
    });
  });

  document.querySelector("#dim").addEventListener("click", () => {
    const input = document.querySelector("#qtd");
    input.value = Math.max(1, parseInt(input.value, 10) - 1);
  });
  document.querySelector("#aum").addEventListener("click", () => {
    const input = document.querySelector("#qtd");
    input.value = parseInt(input.value, 10) + 1;
  });

  document.querySelector("#add-carrinho").addEventListener("click", () => {
    const qtd = parseInt(document.querySelector("#qtd").value, 10) || 1;
    adicionarAoCarrinho(produto, qtd);
    toast("Produto adicionado ao carrinho.");
  });

  document.querySelector("#falar-produto").addEventListener("click", () => {
    falarSobreProduto(produto);
  });

  document.querySelector("#compartilhar").addEventListener("click", async () => {
    const resultado = await compartilharProduto(produto);
    if (resultado === "copiado") toast("Link copiado para a área de transferência.");
  });

  document.querySelector("#copiar-link").addEventListener("click", async () => {
    await navigator.clipboard.writeText(window.location.href);
    toast("Link copiado.");
  });

  incrementarVisualizacao(id);
  atualizarBadgeCarrinho();
  carregarRelacionados(produto);
}

async function carregarRelacionados(produtoAtual) {
  const secao = document.querySelector("#produtos-relacionados");
  const track = document.querySelector("#relacionados-track");
  const btnPrev = document.querySelector("#relacionados-prev");
  const btnNext = document.querySelector("#relacionados-next");

  const todos = await listarProdutos({ apenasAtivos: true });
  const outros = todos.filter(p => p.id !== produtoAtual.id);

  const mesmaCategoria = outros.filter(p => p.categoria && p.categoria === produtoAtual.categoria);
  const resto = outros.filter(p => !mesmaCategoria.includes(p));
  const relacionados = [...mesmaCategoria, ...resto].slice(0, 8);

  if (!relacionados.length) return;

  secao.hidden = false;
  renderizarGrade(track, relacionados);

  track.addEventListener("adicionar-carrinho", (e) => {
    adicionarAoCarrinho(e.detail, 1);
    toast("Produto adicionado ao carrinho.");
  });
  track.addEventListener("falar-produto", (e) => falarSobreProduto(e.detail));

  function atualizarSetas() {
    const max = track.scrollWidth - track.clientWidth - 2;
    btnPrev.disabled = track.scrollLeft <= 0;
    btnNext.disabled = track.scrollLeft >= max;
  }

  btnPrev.addEventListener("click", () => {
    track.scrollBy({ left: -track.clientWidth * 0.9, behavior: "smooth" });
  });
  btnNext.addEventListener("click", () => {
    track.scrollBy({ left: track.clientWidth * 0.9, behavior: "smooth" });
  });
  track.addEventListener("scroll", atualizarSetas);
  window.addEventListener("resize", atualizarSetas);
  requestAnimationFrame(atualizarSetas);
}

iniciar();
</script>
</body>
</html>
